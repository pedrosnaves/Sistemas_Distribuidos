syntax = "proto3";
package sdgrpc.v1;

// O cliente conhece apenas o endereco inicial do servico de nomes.
service NamingService {
  rpc Bind (Binding) returns (Status);
  rpc Lookup (Name) returns (Address);
  rpc Unbind (Name) returns (Status);
  rpc Rebind (Binding) returns (Status);
}
message Name { string name = 1; }
message Address { string host = 1; uint32 port = 2; }
message Binding { string name = 1; Address address = 2; }
message Status { string message = 1; }

service CalculatorService {
  rpc Calculate (Calculation) returns (CalculationResult);
}
enum Operation { ADD = 0; SUBTRACT = 1; MULTIPLY = 2; DIVIDE = 3; }
message Calculation { double a = 1; double b = 2; Operation operation = 3; }
message CalculationResult {
  double result = 1;
  string machine = 2;
  uint32 process_id = 3;
}

service TextService {
  rpc Analyze (TextRequest) returns (TextAnalysis);
}
message TextRequest { string text = 1; }
message TextAnalysis {
  string uppercase = 1;
  uint32 characters = 2;
  uint32 words = 3;
  string machine = 4;
  uint32 process_id = 5;
}
