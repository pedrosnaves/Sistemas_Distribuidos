syntax = "proto3";

message Empty {}

message Ack {
  bool ok = 1;
  string message = 2;
}

message PeerInfo {
  string ip = 1;
  int32 rpc_port = 2;
  int32 udp_port = 3;
}

message PeerList {
  repeated PeerInfo peers = 1;
}

message StartRequest {
  int32 round_id = 1;
  int32 peer_id = 2;
  int32 num_msgs = 3;
}

message MessageRecord {
  int32 sender_id = 1;
  int32 seq = 2;
}

message PeerLog {
  int32 round_id = 1;
  int32 peer_id = 2;
  repeated MessageRecord messages = 3;
  int32 retransmissions = 4;
  int32 buffered_fifo = 5;
  int32 duplicates_discarded = 6;
}

service GroupManager {
  rpc Register (PeerInfo) returns (Ack);
  rpc Unregister (PeerInfo) returns (Ack);
  rpc ListPeers (Empty) returns (PeerList);
  rpc Stop (Empty) returns (Ack);
}

service PeerControl {
  rpc StartRound (StartRequest) returns (Ack);
  rpc Shutdown (Empty) returns (Ack);
}

service Comparison {
  rpc SubmitLog (PeerLog) returns (Ack);
}
